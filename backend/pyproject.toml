[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slotwise-api"
version = "0.1.0"
description = "Booking and customer management API for Slotwise"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.1,<3.0",
    "pydantic>=2.8,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
